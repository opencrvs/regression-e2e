name: Pull request checks

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and typecheck
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm format:check

  changed-tests:
    name: Run the changed tests
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      DOMAIN: qa.opencrvs.dev
      BASE_REF: origin/${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Playwright compares the files with the base branch.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6.1.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      # Playwright finds the test files that changed, and the test files that
      # import a changed file. It does not see a change to the dependencies or
      # to the config, so then we run all the tests.
      #
      # Each test runs three times with no retry, so that a flaky test fails.
      # CLAUDE.md asks for the same check before a test is added.
      - name: Run the changed tests against ${{ env.DOMAIN }}
        run: |
          if git diff --name-only "$BASE_REF"...HEAD \
            | grep -qxE 'package\.json|pnpm-lock\.yaml|playwright\.config\.ts|\.nvmrc'; then
            echo "The dependencies or the config changed. Run all the tests."
            pnpm exec playwright test --repeat-each 3 --retries 0
          else
            pnpm exec playwright test --only-changed="$BASE_REF" \
              --pass-with-no-tests --repeat-each 3 --retries 0
          fi

      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pull-request-report-${{ github.run_id }}
          path: |
            playwright-report/
            ctrf/
          retention-days: 14
