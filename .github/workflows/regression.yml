name: Regression tests

on:
  schedule:
    # Every night at 01:00 UTC, when nobody uses the environment.
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: The environment to test
        type: choice
        options:
          - qa
        default: qa
      grep:
        description: Run only the tests that match this pattern, for example @C808
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: regression-${{ inputs.environment || 'qa' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    outputs:
      failed-tests: ${{ steps.summary.outputs.text }}
    env:
      DOMAIN: ${{ inputs.environment || 'qa' }}.opencrvs.dev
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      - name: Run the tests against ${{ env.DOMAIN }}
        env:
          GREP: ${{ inputs.grep }}
        run: pnpm exec playwright test ${GREP:+--grep "$GREP"}

      - name: List the failed tests
        id: summary
        if: ${{ failure() }}
        run: |
          report=ctrf/ctrf-report.json
          if [ ! -f "$report" ]; then
            exit 0
          fi
          delimiter="EOF_$(openssl rand -hex 8)"
          {
            echo "text<<$delimiter"
            jq -r '
              "\(.results.summary.failed) of \(.results.summary.tests) tests failed:",
              (.results.tests[] | select(.status == "failed") | "• \(.name)")
            ' "$report"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Upload the report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: regression-report-${{ github.run_id }}
          path: |
            playwright-report/
            ctrf/
          retention-days: 30

  notify:
    name: Send a Slack message on failure
    needs: test
    # A cancelled run does not send a message.
    if: ${{ failure() }}
    runs-on: ubuntu-26.04
    steps:
      - name: Make the message
        env:
          DOMAIN: ${{ inputs.environment || 'qa' }}.opencrvs.dev
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILED_TESTS: ${{ needs.test.outputs.failed-tests }}
        run: |
          jq -n \
            --arg domain "$DOMAIN" \
            --arg url "$RUN_URL" \
            --arg failed "$FAILED_TESTS" \
            '{
              channel: "C02P91N0E1W",
              text: ":x: The regression tests failed on \($domain). <\($url)|Open the run>\n\($failed)"
            }' > payload.json

      - uses: slackapi/slack-github-action@v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload-file-path: payload.json
